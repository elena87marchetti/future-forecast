<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Future Forecast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a weather-forecast strip tracks the 9 "tappe"; one exercise per page in a single reading column; grammar cards dock on the right on wide screens, slide over on phones. */
:root {
  --bg: #EDF2F6;
  --surface: #FFFFFF;
  --surface-2: #F5F8FB;
  --ink: #13233A;
  --muted: #56667B;
  --line: #CDD8E2;
  --sky: #2463AE;
  --sky-soft: #DCE8F6;
  --sun: #F2B200;
  --sun-ink: #8A5A00;
  --ok: #17804A;
  --ok-bg: #E2F4EA;
  --ko: #C2412B;
  --ko-bg: #FBE7E2;
  --near: #A86A00;
  --near-bg: #FFF2D6;
  --shadow: 0 1px 2px rgba(19,35,58,.06), 0 6px 20px rgba(19,35,58,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --drawer-w: 430px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1626; --surface: #14223A; --surface-2: #1A2A45; --ink: #E6EDF6; --muted: #9DADC2;
    --line: #2A3C59; --sky: #86B6F2; --sky-soft: #1F3558; --sun: #FFC93C; --sun-ink: #FFD978;
    --ok: #5BCB8B; --ok-bg: #143829; --ko: #F2826C; --ko-bg: #3D1F1B; --near: #F2BF4A; --near-bg: #3A2E12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1626; --surface: #14223A; --surface-2: #1A2A45; --ink: #E6EDF6; --muted: #9DADC2;
  --line: #2A3C59; --sky: #86B6F2; --sky-soft: #1F3558; --sun: #FFC93C; --sun-ink: #FFD978;
  --ok: #5BCB8B; --ok-bg: #143829; --ko: #F2826C; --ko-bg: #3D1F1B; --near: #F2BF4A; --near-bg: #3A2E12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

.shell { transition: margin-right .25s ease; }
body.docked .shell { margin-right: var(--drawer-w); }

/* Header + forecast strip */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand .ic { width: 28px; height: 28px; color: var(--sun); }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; white-space: nowrap; }
.strip { display: flex; gap: 4px; flex: 1 1 320px; justify-content: center; min-width: 0; }
.slot {
  flex: 0 1 46px; min-width: 32px; display: grid; justify-items: center; gap: 1px;
  background: none; border: 1px solid transparent; border-radius: 8px; padding: 3px 2px 4px; cursor: pointer;
}
.slot:hover { background: var(--surface-2); }
.slot[aria-current="page"] { border-color: var(--sky); background: var(--sky-soft); }
.slot .d { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.slot .ic { width: 22px; height: 22px; color: var(--line); }
.slot.done .ic { color: var(--sun); }
.slot.tried .ic { color: var(--muted); }
.dots { display: flex; gap: 2px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--sun); }
.cards-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--sky); color: var(--surface); border: 0; border-radius: 999px;
  padding: 8px 16px; font-weight: 700; cursor: pointer; white-space: nowrap; margin-left: auto;
}
.cards-btn svg { width: 18px; height: 18px; }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.col { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }

h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(34px, 7vw, 56px); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: clamp(24px, 4.4vw, 32px); font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 19px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
.lead { font-size: 19px; color: var(--muted); max-width: 62ch; }

/* Home */
.hero { display: grid; gap: 12px; padding-top: 8px; }
.hero h1 span { color: var(--sun-ink); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.how div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.how b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 2px; }
.how p { color: var(--muted); font-size: 15px; }
.tappe { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tappa {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start;
}
.tappa:hover { border-color: var(--sky); }
.tappa .n { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.tappa .t { grid-column: 1; font-weight: 700; line-height: 1.3; }
.tappa .suns { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 1px; }
.suns svg { width: 18px; height: 18px; color: var(--line); }
.suns svg.on { color: var(--sun); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 16px; font-weight: 700; cursor: pointer; min-height: 44px;
}
.btn:hover { border-color: var(--sky); }
.btn.primary { background: var(--sky); border-color: var(--sky); color: var(--surface); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: #1B1300; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.link { border: 0; background: none; color: var(--sky); padding: 6px 0; min-height: 0; text-decoration: underline; text-underline-offset: 3px; }

/* Exercise page */
.ex-head { display: grid; gap: 8px; }
.instr { font-size: 18px; font-weight: 700; }
.ex-meta { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 15px; }
.review {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--sky); color: var(--sky);
  background: var(--sky-soft); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; cursor: pointer;
}
.review svg { width: 16px; height: 16px; }
.bank { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; }
.bank span { font-weight: 700; letter-spacing: .04em; font-size: 14px; padding: 3px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.bank span.used { text-decoration: line-through; color: var(--muted); }

ol.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: it; }
ol.items > li {
  counter-increment: it; position: relative;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px 14px 52px; min-width: 0;
}
ol.items > li::before {
  content: counter(it); position: absolute; left: 14px; top: 14px;
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sky-soft); color: var(--sky); font-weight: 700; font-size: 14px;
}
.prompt { font-weight: 700; margin-bottom: 6px; }
.prompt .tag { font-weight: 400; font-style: italic; color: var(--muted); }
.line { line-height: 2.3; overflow-wrap: anywhere; }
.hint { color: var(--muted); font-style: italic; }
.blank { display: inline-flex; flex-direction: column; vertical-align: top; max-width: 100%; }
.blank.wide { display: flex; width: 100%; margin: 4px 0; }
input.inp, select.inp {
  font: inherit; color: var(--ink); background: var(--surface-2);
  border: 0; border-bottom: 2px solid var(--muted); border-radius: 6px 6px 0 0;
  padding: 4px 8px; line-height: 1.4; max-width: 100%;
}
.blank.wide input.inp { width: 100%; }
input.inp:focus, select.inp:focus { outline: none; border-bottom-color: var(--sky); background: var(--sky-soft); }
.inp.ok { border-bottom-color: var(--ok); background: var(--ok-bg); }
.inp.ko { border-bottom-color: var(--ko); background: var(--ko-bg); }
.inp.near { border-bottom-color: var(--near); background: var(--near-bg); }
.note { font-size: 13px; line-height: 1.3; font-weight: 700; padding: 2px 2px 0; }
.note.ko { color: var(--ko); }
.note.near { color: var(--near); }
.note.sol { color: var(--ok); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.ch {
  border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 8px;
  padding: 6px 14px; font-weight: 700; cursor: pointer; letter-spacing: .02em; min-height: 40px;
}
.ch[aria-pressed="true"] { border-color: var(--sky); background: var(--sky-soft); color: var(--sky); }
.ch.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.ch.ko { border-color: var(--ko); background: var(--ko-bg); color: var(--ko); }
.ch.sol { border-style: dashed; border-color: var(--ok); color: var(--ok); }
.ch:disabled { cursor: default; }
.why { margin-top: 8px; font-size: 15px; color: var(--muted); }
.why b { color: var(--ink); }
.blankline { display: inline-block; min-width: 70px; border-bottom: 2px solid var(--muted); margin: 0 4px; transform: translateY(-4px); }

.free { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.free .fl { display: grid; gap: 6px; }
.free .fl label { font-weight: 700; }
.free .frow { display: flex; gap: 8px; flex-wrap: wrap; }
.free .frow input { flex: 1 1 240px; min-width: 0; }

.bar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--line); padding-top: 16px;
}
.score { display: flex; align-items: center; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score .big { font-family: var(--f-display); font-size: 26px; }
.msg { font-size: 15px; color: var(--muted); }

/* Results */
.res-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.res-table td, .res-table th { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.res-table th { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.res-table td.num { text-align: right; white-space: nowrap; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
.total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.total .big { font-family: var(--f-display); font-size: 56px; font-weight: 800; color: var(--sun-ink); line-height: 1; }

/* Drawer with grammar cards */
.backdrop { position: fixed; inset: 0; background: rgba(8,16,30,.45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w), 100%); z-index: 50;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  transform: translateX(100%); transition: transform .25s ease; visibility: hidden;
}
.drawer.open { transform: none; visibility: visible; }
.dr-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 8px; }
.dr-head h2 { font-size: 22px; }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 40px; height: 40px; cursor: pointer; font-size: 20px; line-height: 1; }
.tabs { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 4px 16px 12px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 5px 12px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.card { overflow-y: auto; padding: 16px 18px 40px; display: grid; gap: 14px; align-content: start; font-size: 16px; }
.card h3 { font-size: 22px; font-weight: 800; }
.card h4 { margin: 4px 0 0; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--sky); }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.card .ex { font-style: italic; color: var(--muted); }
.card .en { font-weight: 700; }
.card table { border-collapse: collapse; width: 100%; font-size: 15px; }
.card th, .card td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.card th { background: var(--surface-2); font-size: 13px; }
.card .tw { overflow-x: auto; }
.warn { background: var(--near-bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.warn b { color: var(--near); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.vt {
  display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 1px 10px; align-items: center; align-content: start;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
}
.vt .em {
  grid-row: 1 / span 3; align-self: center; text-align: center; line-height: 1;
  font-size: 32px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
.vt .em.two { font-size: 21px; letter-spacing: -2px; }
.vt .w { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.vt .it { color: var(--muted); font-size: 14px; line-height: 1.3; }
.vt .def { font-size: 13px; font-style: italic; color: var(--muted); line-height: 1.3; }
mark { background: var(--sun); color: #1B1300; padding: 0 3px; border-radius: 3px; }

@media (min-width: 1100px) {
  body.docked .backdrop { display: none; }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  ol.items > li { padding: 12px 12px 12px 44px; }
  ol.items > li::before { left: 10px; top: 12px; width: 24px; height: 24px; }
  .brand b { font-size: 18px; }
  .cards-btn { padding: 7px 12px; }
  .strip { order: 3; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, .shell { transition: none; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-in">
      <button class="brand" id="brand" type="button" aria-label="Torna alla pagina iniziale">
        <span class="ic" id="brand-ic"></span><b>Future Forecast</b>
      </button>
      <nav class="strip" id="strip" aria-label="Tappe del gioco"></nav>
      <button class="cards-btn" id="open-cards" type="button" aria-controls="drawer">
        <span id="book-ic"></span>Schede
      </button>
    </div>
  </header>
  <main><div class="col" id="app"></div></main>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" aria-label="Schede riassuntive" aria-hidden="true">
  <div class="dr-head">
    <h2>Schede riassuntive</h2>
    <button class="x" id="close-cards" type="button" aria-label="Chiudi le schede">×</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="card" id="card" role="tabpanel"></div>
</aside>

<script>
/* ---------- Icons ---------- */
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
const CLOUD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.5h9.9a4.1 4.1 0 0 0 .5-8.2 5.6 5.6 0 0 0-10.7-1A4.6 4.6 0 0 0 7.2 18.5z" fill="currentColor"/></svg>';
const BOOK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 21H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
document.getElementById('brand-ic').innerHTML = SUN;
document.getElementById('book-ic').innerHTML = BOOK;

/* ---------- Helpers ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const arr = x => Array.isArray(x) ? x : [x];
const B = (a, w) => ({ a: arr(a), w: w || Math.max(...arr(a).map(s => s.length)) });   // inline blank
const W = a => ({ a: arr(a), wide: true });                                               // full-width blank
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[.!?,;:"“”]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
const normVocab = s => norm(s).replace(/^(a|an|the) /, '');
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

/* be going to */
const BE = { I: ['am', "'m"], he: ['is', "'s"], we: ['are', "'re"] };
function gt(p, v, neg) {
  const [full, c] = BE[p];
  if (!neg) return [`${full} going to ${v}`, `${c} going to ${v}`];
  const r = [`${full} not going to ${v}`, `${c} not going to ${v}`];
  if (p === 'he') r.push(`isn't going to ${v}`);
  if (p === 'we') r.push(`aren't going to ${v}`);
  return r;
}
/* will / won't / may / might */
const CONTR = { i: "i'll", you: "you'll", he: "he'll", she: "she'll", it: "it'll", we: "we'll", they: "they'll", there: "there'll" };
function wm(subj, vp, mode) {
  const s = subj.toLowerCase();
  if (mode === 'will') return [`${s} will ${vp}`].concat(CONTR[s] ? [`${CONTR[s]} ${vp}`] : []);
  if (mode === 'wont') return [`${s} won't ${vp}`, `${s} will not ${vp}`];
  if (mode === 'may') return [`${s} may ${vp}`, `${s} might ${vp}`];
  return [`${s} may not ${vp}`, `${s} might not ${vp}`, `${s} mightn't ${vp}`];
}
const SA = (prons, yes) => prons.flatMap(p => yes ? [`${p} will`] : [`${p} won't`, `${p} will not`]);
const WILL = v => [`will ${v}`, `'ll ${v}`];
const WONT = v => [`won't ${v}`, `will not ${v}`];

/* ---------- Exercises ---------- */

    const two = Array.isArray(em);

  }).join('') + '</div>';
}

<h3>May / might</h3>
<ul>
<li>Esprimono una <b>possibilità</b>: forse succederà, forse no.</li>
<li>Forma: <b>may / might + verbo base</b>. Negativa: <b>may not / might not</b>.</li>

</ul>

<div class="tw"><table>

<tr><td><b>not sure</b> (forse)</td><td>It <mark>may / might</mark> rain.</td><td>It <mark>may not / might not</mark> rain.</td></tr>
</table></div>
<p class="warn"><b>Attenzione:</b> <i>maybe</i> (= forse) è un avverbio: <span class="en">Maybe it will rain</span> = <span class="en">It may rain</span>.</p>` },
  { id: 'compare', label: 'Will o going to?', html: `
<h3>Will o be going to?</h3>

<tr><td><b>Prova evidente adesso</b><br><span class="ex">Look! That rock is moving! It's going to fall!</span></td><td><b>Futuro lontano, incerto</b><br><span class="ex">In 2050 people will live on the Moon.</span></td></tr>

<h4>Parole spia</h4>

  { id: 'relative', label: 'Pronomi relativi', html: `
<h3>Pronomi relativi</h3>

  { id: 'conditional', label: 'First conditional', html: `

/* ---------- State ---------- */
const KEY = 'future-forecast-v1';
let state;
function newRound() {
  return {
    page: 0,
    ex: EX.map(d => ({ items: d.gen(), free: d.genFree ? d.genFree() : null, ans: {}, marks: {}, freeRes: {}, last: null, best: null, revealed: false })),
  };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.ex && s.ex.length === EX.length) return s; } catch (e) {}
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const sunsFor = r => { if (!r || !r.tot) return 0; const p = r.ok / r.tot; return p >= .9 ? 3 : p >= .7 ? 2 : p >= .5 ? 1 : 0; };
const sunsHTML = n => [0, 1, 2].map(i => SUN.replace('<svg', `<svg class="${i < n ? 'on' : ''}"`)).join('');

/* ---------- Strip ---------- */
function renderStrip() {
  const el = document.getElementById('strip');
  el.innerHTML = EX.map((d, i) => {
    const e = state.ex[i], n = sunsFor(e.best), cls = n ? 'done' : (e.best ? 'tried' : '');
    return `<button type="button" class="slot ${cls}" data-go="${i + 1}" ${state.page === i + 1 ? 'aria-current="page"' : ''} aria-label="Tappa ${i + 1}: ${esc(d.short)}${e.best ? ', ' + n + ' soli' : ''}">
      <span class="d">T${i + 1}</span><span class="ic">${n ? SUN : CLOUD}</span>
      <span class="dots">${[0, 1, 2].map(k => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</span></button>`;
  }).join('');
}

/* ---------- Pages ---------- */
const app = document.getElementById('app');
function go(p) { state.page = p; save(); render(); window.scrollTo(0, 0); }

function render() {
  renderStrip();
  if (state.page === 0) renderHome();
  else if (state.page <= EX.length) renderEx(state.page - 1);
  else renderResults();
}

function renderHome() {
  const any = state.ex.some(e => e.best);
  app.innerHTML = `
  <section class="hero">
    <p class="eyebrow">Inglese · Terza media · Ripasso per la verifica</p>
    <h1>Future <span>Forecast</span></h1>
    <p class="lead">Nove tappe per allenarti sul futuro: be going to, will, may e might, first conditional, pronomi relativi, verbi + -ing o to, lavori e meteo estremo. Ogni partita pesca frasi diverse.</p>
  </section>
  <section class="how" aria-label="Come si gioca">
    <div><b>1. Rispondi</b><p>Scrivi o scegli la risposta. Le schede con regole e vocaboli sono sempre aperte con il pulsante <i>Schede</i>.</p></div>
    <div><b>2. Controlla</b><p>Verde = giusto, rosso = sbagliato, giallo = quasi (controlla l'ortografia). Puoi riprovare quante volte vuoi.</p></div>
    <div><b>3. Guadagna soli</b><p>Fino a 3 soli per tappa. Se guardi le soluzioni, il punteggio della tappa si blocca.</p></div>
  </section>
  <section style="display:grid;gap:12px">
    <h2>Le tappe</h2>
    <div class="tappe">${EX.map((d, i) => `<button type="button" class="tappa" data-go="${i + 1}">
      <span class="n">Tappa ${i + 1}</span><span class="suns" aria-label="${sunsFor(state.ex[i].best)} soli su 3">${sunsHTML(sunsFor(state.ex[i].best))}</span>
      <span class="t">${esc(d.short)}</span></button>`).join('')}</div>
  </section>
  <div class="row">
    <button class="btn sun" type="button" data-go="1">${any ? 'Continua dalla tappa 1' : 'Inizia dalla tappa 1'}</button>
    ${any ? '<button class="btn" type="button" data-go="10">Vedi i risultati</button>' : ''}
    <button class="btn" type="button" id="reset">Nuova partita con frasi nuove</button>
  </div>`;
  armReset();
}

function armReset() {
  const r = document.getElementById('reset'); if (!r) return;
  let armed = false;
  r.onclick = () => {
    if (!armed) { armed = true; r.textContent = 'Sicuro? I soli si azzerano. Clicca di nuovo'; return; }
    state = newRound(); save(); render(); window.scrollTo(0, 0);
  };
}

function blankHTML(ei, ii, bi, b, ex, vocab, bank) {
  const id = `in-${ei}-${ii}-${bi}`, key = `${ii}-${bi}`, m = ex.marks[key], v = ex.ans[key] || '';
  let note = '';
  if (m === 'near') note = `<span class="note near">Quasi! Controlla l'ortografia.</span>`;
  if (ex.revealed && m !== 'ok') note = `<span class="note sol">✓ ${esc(b.sel ? b.a.join(' / ') : b.a[0])}</span>`;
  const lock = ex.revealed || m === 'ok';
  if (b.sel) {
    return `<span class="blank"><select class="inp ${m || ''}" id="${id}" data-k="${key}" ${lock ? 'disabled' : ''} aria-label="Scegli la parola">
      <option value="">— scegli —</option>${bank.map(w => `<option ${v === w ? 'selected' : ''}>${w}</option>`).join('')}</select>${note}</span>`;
  }
  const style = b.wide ? '' : `style="width:calc(${Math.min(b.w, 34)}ch + 1.6em)"`;
  return `<span class="blank ${b.wide ? 'wide' : ''}"><input class="inp ${m || ''}" id="${id}" data-k="${key}" type="text" value="${esc(v)}" ${style}
    autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${lock ? 'readonly' : ''} aria-label="Risposta"></span>${note ? '<br>' + note : ''}`;
}

function renderEx(ei) {
  const d = EX[ei], ex = state.ex[ei];
  const items = ex.items.map((it, ii) => {
    if (it.o) {
      const sel = ex.ans[ii], m = ex.marks[ii];
      const [a, z] = it.t.split('___');
      const done = ex.revealed || m === 'ok';
      const btns = it.o.map((o, oi) => {
        let cls = '';
        if (m && sel === oi) cls = it.c.includes(oi) ? 'ok' : 'ko';
        else if (ex.revealed && it.c.includes(oi)) cls = 'sol';
        return `<button type="button" class="ch ${cls}" data-ch="${ii}" data-o="${oi}" aria-pressed="${sel === oi}" ${done ? 'disabled' : ''}>${esc(o)}</button>`;
      }).join('');
      const why = (m === 'ok' || ex.revealed) ? `<p class="why"><b>Perché:</b> ${it.why}</p>` : '';
      return `<li><div class="line">${esc(a)}<span class="blankline" aria-hidden="true"></span>${esc(z)}</div><div class="choices">${btns}</div>${why}</li>`;
    }
    const prompt = it.prompt ? `<div class="prompt">${esc(it.prompt)} ${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}</div>` : '';
    const line = it.parts.map((p, bi) => typeof p === 'string' ? esc(p) : blankHTML(ei, ii, bi, p, ex, d.vocab, d.bank)).join('');
    return `<li>${prompt}<div class="line">${line}</div></li>`;
  }).join('');

  let bank = '';
  if (d.bank) {
    const used = new Set(Object.values(ex.ans));
    bank = `<div class="bank" aria-label="Parole da usare">${d.bank.map(w => `<span class="${used.has(w) ? 'used' : ''}">${w}</span>`).join('')}</div>`;
  }

  let free = '';
  if (ex.free) {
    free = `<section class="free" aria-label="Ora tocca a te"><h3>Ora tocca a te</h3>
    <p class="msg">Completa le frasi con un verbo e altre parole, in modo personale. Il gioco controlla solo la forma del verbo; il resto lo controlla l'insegnante. Queste frasi non danno punti.</p>
    ${ex.free.map((f, k) => {
      const r = ex.freeRes[k];
      return `<div class="fl"><label for="fr-${ei}-${k}">${esc(f.s)} …</label>
      <div class="frow"><input class="inp" id="fr-${ei}-${k}" data-f="${k}" type="text" value="${esc(ex.ans['f' + k] || '')}" autocomplete="off" spellcheck="false" placeholder="continua la frase">
      <button class="btn" type="button" data-fc="${k}">Controlla la forma</button></div>
      ${r ? `<span class="note ${r.ok ? 'sol' : 'ko'}">${esc(r.msg)}</span>` : ''}</div>`;
    }).join('')}</section>`;
  }

  const last = ex.last, n = sunsFor(ex.best);
  const allOk = last && last.ok === last.tot;
  let msg = '';
  if (ex.revealed) msg = 'Soluzioni mostrate: il punteggio di questa tappa è bloccato.';
  else if (allOk) msg = 'Tutto giusto! Passa alla tappa successiva.';
  else if (last) msg = 'Correggi le risposte rosse o gialle e controlla di nuovo.';
  const card = CARDS.find(c => c.id === d.card);

  app.innerHTML = `
  <header class="ex-head">
    <p class="eyebrow">Tappa ${ei + 1} di ${EX.length}</p>
    <h2>${esc(d.title)}</h2>
    <p class="instr">${esc(d.instr)}</p>
    <div class="ex-meta"><span>${esc(d.help)}</span>
      <button type="button" class="review" data-card="${card.id}">${BOOK}Ripassa: ${esc(card.label)}</button></div>
  </header>
  ${bank}
  <ol class="items">${items}</ol>
  ${free}
  <div class="bar">
    <div class="score" aria-live="polite">${last ? `<span class="big">${last.ok}/${last.tot}</span><span class="suns">${sunsHTML(n)}</span>` : '<span class="msg">Rispondi e premi Controlla.</span>'}</div>
    <div class="row">
      ${!ex.revealed && !allOk ? '<button class="btn primary" type="button" id="check">Controlla</button>' : ''}
      ${last && !allOk && !ex.revealed ? '<button class="btn" type="button" id="reveal">Mostra soluzioni</button>' : ''}
      ${ex.revealed ? '<button class="btn" type="button" id="redo">Rifai con frasi nuove</button>' : ''}
    </div>
  </div>
  ${msg ? `<p class="msg">${msg}</p>` : ''}
  <div class="row" style="justify-content:space-between">
    <button class="btn" type="button" data-go="${ei}">← ${ei === 0 ? 'Inizio' : 'Tappa ' + ei}</button>
    <button class="btn ${allOk || ex.revealed ? 'sun' : ''}" type="button" data-go="${ei + 2}">${ei + 1 === EX.length ? 'Vedi i risultati' : 'Tappa ' + (ei + 2)} →</button>
  </div>`;

  // wiring
  app.querySelectorAll('input.inp[data-k]').forEach((inp, idx, all) => {
    inp.addEventListener('input', () => { ex.ans[inp.dataset.k] = inp.value; if (ex.marks[inp.dataset.k] && ex.marks[inp.dataset.k] !== 'ok') { delete ex.marks[inp.dataset.k]; inp.classList.remove('ko', 'near'); } save(); });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return; e.preventDefault();
      const nx = Array.from(all).slice(idx + 1).find(x => !x.readOnly);
      if (nx) nx.focus(); else check(ei);
    });
  });
  app.querySelectorAll('select.inp').forEach(s => s.addEventListener('change', () => { ex.ans[s.dataset.k] = s.value; delete ex.marks[s.dataset.k]; save(); renderEx(ei); document.getElementById(s.id)?.focus(); }));
  app.querySelectorAll('[data-ch]').forEach(b => b.addEventListener('click', () => {
    const ii = +b.dataset.ch; ex.ans[ii] = +b.dataset.o; delete ex.marks[ii]; save(); renderEx(ei);
    app.querySelector(`[data-ch="${ii}"][data-o="${b.dataset.o}"]`)?.focus();
  }));
  app.querySelectorAll('input[data-f]').forEach(inp => inp.addEventListener('input', () => { ex.ans['f' + inp.dataset.f] = inp.value; delete ex.freeRes[inp.dataset.f]; save(); }));
  app.querySelectorAll('[data-fc]').forEach(b => b.addEventListener('click', () => { checkFree(ei, +b.dataset.fc); }));
  document.getElementById('check')?.addEventListener('click', () => check(ei));
  document.getElementById('reveal')?.addEventListener('click', () => { ex.revealed = true; save(); renderEx(ei); });
  document.getElementById('redo')?.addEventListener('click', () => {
    state.ex[ei] = { items: d.gen(), free: d.genFree ? d.genFree() : null, ans: {}, marks: {}, freeRes: {}, last: null, best: ex.best, revealed: false };
    save(); render(); window.scrollTo(0, 0);
  });
}

function check(ei) {
  const d = EX[ei], ex = state.ex[ei], N = d.vocab ? normVocab : norm;
  let ok = 0, tot = 0;
  ex.items.forEach((it, ii) => {
    if (it.o) {
      tot++; const v = ex.ans[ii];
      if (v === undefined || v === null) { delete ex.marks[ii]; return; }
      const good = it.c.includes(v); ex.marks[ii] = good ? 'ok' : 'ko'; if (good) ok++;
      return;
    }
    it.parts.forEach((p, bi) => {
      if (typeof p === 'string') return;
      tot++; const k = `${ii}-${bi}`, raw = ex.ans[k] || '';
      if (!raw.trim()) { ex.marks[k] = 'ko'; return; }
      if (p.sel) { const g = p.a.includes(raw); ex.marks[k] = g ? 'ok' : 'ko'; if (g) ok++; return; }
      const v = N(raw), acc = p.a.map(N);
      if (acc.includes(v)) { ex.marks[k] = 'ok'; ok++; return; }
      const near = acc.some(a => a.length >= 4 && lev(a, v) <= (a.length > 18 ? 2 : 1));
      ex.marks[k] = near ? 'near' : 'ko';
    });
  });
  ex.last = { ok, tot };
  if (!ex.best || ok > ex.best.ok) ex.best = { ok, tot };
  save(); renderEx(ei);
  const firstBad = app.querySelector('.inp.ko:not([readonly]), .inp.near:not([readonly])');
  (firstBad || app.querySelector('.score')).scrollIntoView({ block: 'center', behavior: 'smooth' });
}

const ING_EXC = ['bring', 'sing', 'ring', 'swing', 'sting', 'cling', 'fling', 'string', 'spring', 'wring'];
function checkFree(ei, k) {
  const ex = state.ex[ei], f = ex.free[k], v = norm(ex.ans['f' + k] || '');
  const w = v.split(' ').filter(Boolean);
  let res;
  if (w.length < 2) res = { ok: false, msg: 'Scrivi almeno un verbo e qualche altra parola.' };
  else {
    const isTo = w[0] === 'to', isIng = w[0].length > 4 && w[0].endsWith('ing') && !ING_EXC.includes(w[0]);
    const good = f.p === 'ing' ? isIng : f.p === 'to' ? isTo : f.p === 'both' ? (isIng || isTo) : (!isTo && !isIng);
    res = good ? { ok: true, msg: `✓ Forma giusta (${f.r}). Il resto della frase lo controlla l'insegnante.` }
               : { ok: false, msg: `Controlla la forma: ${f.r}.` };
  }
  ex.freeRes[k] = res; save(); renderEx(ei);
  document.getElementById(`fr-${ei}-${k}`)?.focus();
}

function renderResults() {
  const rows = EX.map((d, i) => {
    const b = state.ex[i].best, n = sunsFor(b);
    return `<tr><td>T${i + 1}</td><td><button class="btn link" type="button" data-go="${i + 1}">${esc(d.short)}</button></td>
      <td class="num">${b ? b.ok + '/' + b.tot : '—'}</td><td><span class="suns">${sunsHTML(n)}</span></td></tr>`;
  }).join('');
  const tot = EX.reduce((s, _, i) => s + sunsFor(state.ex[i].best), 0);
  const weak = EX.map((d, i) => [d, i]).filter(([, i]) => sunsFor(state.ex[i].best) < 2);
  app.innerHTML = `
  <header class="ex-head"><p class="eyebrow">Risultati</p><h2>Le tue previsioni</h2></header>
  <div class="total"><span class="big">${tot}</span><span>soli su ${EX.length * 3}</span></div>
  <div class="tablewrap"><table class="res-table"><thead><tr><th>Tappa</th><th>Argomento</th><th style="text-align:right">Miglior punteggio</th><th>Soli</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${weak.length ? `<p class="lead">Da ripassare: ${weak.map(([d]) => esc(d.short)).join(', ')}. Apri la scheda dell'argomento e rifai la tappa.</p>` : '<p class="lead">Ottimo lavoro: almeno 2 soli in ogni tappa. Prova una nuova partita con frasi diverse.</p>'}
  <div class="row">
    ${weak.length ? `<button class="btn sun" type="button" data-go="${weak[0][1] + 1}">Rifai: ${esc(weak[0][0].short)}</button>` : ''}
    <button class="btn" type="button" id="reset">Nuova partita con frasi nuove</button>
    <button class="btn" type="button" data-go="0">Pagina iniziale</button>
  </div>`;
  armReset();
}

/* ---------- Drawer ---------- */
const drawer = document.getElementById('drawer'), backdrop = document.getElementById('backdrop');
let currentCard = CARDS[0].id;
const wide = () => window.matchMedia('(min-width: 1100px)').matches;
function showCard(id) {
  currentCard = id;
  document.getElementById('tabs').innerHTML = CARDS.map(c => `<button type="button" role="tab" class="tab" data-tab="${c.id}" aria-selected="${c.id === id}">${esc(c.label)}</button>`).join('');
  const card = document.getElementById('card'); card.innerHTML = CARDS.find(c => c.id === id).html; card.scrollTop = 0;
  document.querySelector(`.tab[data-tab="${id}"]`)?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
}
function openCards(id) {
  showCard(id || currentCard);
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false');
  document.body.classList.add('docked');
  backdrop.hidden = wide();
  document.getElementById('close-cards').focus({ preventScroll: true });
}
function closeCards() {
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('docked'); backdrop.hidden = true;
}
document.getElementById('open-cards').onclick = () => drawer.classList.contains('open') ? closeCards() : openCards();
document.getElementById('close-cards').onclick = closeCards;
backdrop.onclick = closeCards;
document.getElementById('tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) showCard(t.dataset.tab); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeCards(); });
window.addEventListener('resize', () => { if (drawer.classList.contains('open')) backdrop.hidden = wide(); });

/* ---------- Global clicks ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(+g.dataset.go); return; }
  const c = e.target.closest('[data-card]'); if (c) openCards(c.dataset.card);
});
document.getElementById('brand').onclick = () => go(0);

/* ---------- Boot ---------- */
function start(snap) {
  state = (snap && snap.ex && snap.ex.length === EX.length) ? snap : (load() || newRound());
  showCard(currentCard);
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
